name: Publish package to NPM

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Get version from release tag
        id: version
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1 (Node 22 bundles an older npm)
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Set package version to ${{ steps.version.outputs.version }}
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm test
      # Stage-only trusted publisher: uploads to the stage queue; a maintainer approves with 2FA
      - run: npm stage publish
